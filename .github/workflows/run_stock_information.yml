name: Generate Daily Charts

on:
  schedule:
    - cron: "0 6 * * 1-5"    # Mon–Fri at 06:00 UTC
  workflow_dispatch:      # also allows manual trigger

jobs:
  generate-charts:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install plotly kaleido

      # Step 4: Run your script
      - name: Run stock script
        env:
          TELEGRAM_TOKEN_DAX: ${{ secrets.TELEGRAM_TOKEN_DAX }}
          TELEGRAM_TOKEN_SANDBOX: ${{ secrets.TELEGRAM_TOKEN_SANDBOX }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stock_information.py

      # Step 5: Commit generated charts
      - name: Commit and push charts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-missing docs/*.html docs/*.png
          git commit -m "Daily update of charts $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push

