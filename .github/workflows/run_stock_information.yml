name: Generate Daily STOCK Charts

on:
  #schedule:
  #  - cron: "15 4 * * 2-6"
  workflow_dispatch:      # also allows manual trigger

permissions:
  contents: write         # ← FIX: Enables git push for github-actions[bot]

jobs:
  generate-charts:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run DAX script
      - name: Run DAX stock script
        env:
          TELEGRAM_TOKEN_DAX: ${{ secrets.TELEGRAM_TOKEN_DAX }}
          TELEGRAM_TOKEN_SANDBOX: ${{ secrets.TELEGRAM_TOKEN_SANDBOX }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stock_information_DAX.py

      # Step 5: Run MDAX script
      - name: Run MDAX stock script
        env:
          TELEGRAM_TOKEN_MDAX: ${{ secrets.TELEGRAM_TOKEN_MDAX }}
          TELEGRAM_TOKEN_SANDBOX: ${{ secrets.TELEGRAM_TOKEN_SANDBOX }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stock_information_MDAX.py

      # Step 6: Run Nasdaq script
      - name: Run NASDAQ stock script
        env:
          TELEGRAM_TOKEN_NASDAQ: ${{ secrets.TELEGRAM_TOKEN_NASDAQ }}
          TELEGRAM_TOKEN_SANDBOX: ${{ secrets.TELEGRAM_TOKEN_SANDBOX }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stock_information_NASDAQ.py

      # Step 7: Commit generated charts
      - name: Commit and push charts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.html *.csv 2>/dev/null || true
          git commit -m "Daily update of charts and data $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
