name: Gap Reversion Monitoring

on:
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  gap-reversion:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install plotly kaleido pytz tqdm

      # Step 4: Run gap_reversion.py
      - name: Run gap reversion script
        env:
          TELEGRAM_TOKEN_GAP_REV: ${{ secrets.TELEGRAM_TOKEN_GAP_REV }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python gap_reversion.py

      # Step 5: Commit any generated HTML reports
      - name: Commit and push reports
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.html 2>/dev/null || echo "No HTML files to add"
          git commit -m "Daily update of gap reports $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main