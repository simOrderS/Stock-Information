name: Generate Next Day Prediction

on:
  schedule:
    - cron: "0 19 * * 1-5"
  workflow_dispatch:      # also allows manual trigger

permissions:
  contents: write         # ← FIX: Enables git push for github-actions[bot]

jobs:
  generate-charts:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install plotly kaleido

      # Step 4: Run prediction script
      - name: Run next day prediction script
        env:
          TELEGRAM_TOKEN_DAX: ${{ secrets.TELEGRAM_TOKEN_INDEX }}
          TELEGRAM_TOKEN_SANDBOX: ${{ secrets.TELEGRAM_TOKEN_SANDBOX }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python next_day_index_prediction.py

      # Step 7: Commit generated charts
      - name: Commit and push charts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.html 2>/dev/null || echo "No HTML files to add"
          git commit -m "Daily update of charts $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
